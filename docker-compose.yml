services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
      POSTGRES_DB: taskmanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5438:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskmanager']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgres://taskmanager:taskmanager@postgres:5432/taskmanager
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    environment:
      DATABASE_URL: postgres://taskmanager:taskmanager@postgres:5432/taskmanager
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
